<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Retirada de Kits Escolares</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 32px 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-header h2 {
            font-size: 1.3rem;
            color: #38bdf8;
            margin-bottom: 6px;
        }
        .login-header p {
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }
        .form-group input:focus {
            border-color: #0284c7;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn-login:hover {
            background: #0369a1;
        }
        .alert {
            padding: 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            text-align: center;
            margin-top: 14px;
            display: none;
        }
        .alert-danger {
            background: #450a0a;
            color: #fca5a5;
            border: 1px solid #7f1d1d;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h2>Entrega de Kits Escolares</h2>
            <p>Informe suas credenciais para continuar</p>
        </div>

        <form id="form-login">
            <div class="form-group">
                <label for="email">E-mail de Acesso</label>
                <input type="email" id="email" required placeholder="seu.email@funfarme.com.br" />
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="••••••••" />
            </div>

            <button type="submit" class="btn-login">Entrar no Sistema</button>
        </form>

        <div id="alert-error" class="alert alert-danger"></div>
    </div>

    <script>
        document.getElementById("form-login").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;
            const alertBox = document.getElementById("alert-error");

            alertBox.style.display = "none";

            try {
                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, senha })
                });

                const data = await res.json();

                if (res.ok && data.sucesso) {
                    window.location.href = "/";
                } else {
                    alertBox.innerText = data.mensagem || "Erro ao efetuar login.";
                    alertBox.style.display = "block";
                }
            } catch (err) {
                alertBox.innerText = "Erro na conexão com o servidor.";
                alertBox.style.display = "block";
            }
        });
    </script>
</body>
</html>
