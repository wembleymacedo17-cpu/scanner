<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Acessos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cartao_retirada.css') }}">
    <style>
        .main-container {
            max-width: 900px !important;
            width: 95% !important;
            margin: 20px auto !important;
        }

        .tabs-header {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .tab-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background: #e2e8f0;
        }

        .tab-btn.active {
            background: #0284c7;
            color: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.2);
        }

        .section-box {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
        }

        .hidden-tab {
            display: none !important;
        }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; color: #334155; margin-bottom: 6px; }
        .form-group input, .form-group select {
            width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; font-size: 0.9rem; box-sizing: border-box;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .table-responsive { width: 100%; overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
        th { background: #f8fafc; color: #475569; font-weight: 700; text-transform: uppercase; font-size: 0.78rem; letter-spacing: 0.5px; }

        .badge-perfil { padding: 4px 10px; border-radius: 6px; font-weight: 700; font-size: 0.75rem; display: inline-block; }
        .badge-ADMIN { background: #fee2e2; color: #991b1b; }
        .badge-OPERADOR { background: #e0f2fe; color: #0369a1; }
        
        .badge-protected {
            background: #f1f5f9;
            color: #64748b;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            border: 1px solid #cbd5e1;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-action { padding: 7px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: opacity 0.2s; }
        .btn-action:hover { opacity: 0.85; }
        .btn-edit { background: #f59e0b; color: #fff; }
        .btn-delete { background: #ef4444; color: #fff; margin-left: 6px; }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Header Principal sem Emojis -->
        <header class="app-header">
            <div class="header-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <line x1="20" y1="8" x2="20" y2="14"></line>
                    <line x1="17" y1="11" x2="23" y2="11"></line>
                </svg>
            </div>
            <div>
                <h2>Gestão de Acessos</h2>
                <p>Gerenciamento de usuários e privilégios do sistema</p>
            </div>
        </header>

        <!-- Controle de Abas -->
        <div class="tabs-header">
            <button class="tab-btn active" id="btn-tab-exibir" onclick="alternarAba('aba-exibir')">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                Exibir Usuários
            </button>
            <button class="tab-btn" id="btn-tab-adicionar" onclick="alternarAba('aba-adicionar')">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                + Adicionar Usuário
            </button>
        </div>

        <div id="alert-msg" class="alert-banner hidden"></div>

        <!-- ABA 1: Tabela de Usuários -->
        <div id="aba-exibir" class="section-box">
            <h3 style="margin-bottom: 12px; color: #1e293b;">Usuários Cadastrados</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Perfil</th>
                            <th style="text-align: right;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-usuarios">
                        <tr><td colspan="4">Carregando usuários...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ABA 2: Formulário de Cadastro/Edição -->
        <div id="aba-adicionar" class="section-box hidden-tab">
            <h3 id="form-titulo" style="margin-bottom: 16px; color: #1e293b;">Novo Usuário</h3>
            <form id="form-usuario">
                <input type="hidden" id="edit-id" value="" />

                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="nome" required placeholder="Ex: João da Silva" />
                </div>
                <div class="form-group">
                    <label>E-mail Corporativo</label>
                    <input type="email" id="email" required placeholder="joao@funfarme.com.br" />
                </div>
                <div class="form-group">
                    <label id="label-senha">Senha de Acesso</label>
                    <input type="password" id="senha" placeholder="••••••••" />
                </div>
                <div class="form-group">
                    <label>Perfil de Acesso</label>
                    <select id="perfil">
                        <option value="OPERADOR">Operador (Apenas Baixas/Consulta/Histórico)</option>
                        <option value="ADMIN">Administrador / Gestor (Acesso Total)</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" id="btn-salvar-user" class="btn btn-entregar" style="flex: 1;">Salvar Usuário</button>
                    <button type="button" id="btn-cancelar-edit" class="btn btn-secondary hidden" onclick="resetarFormulario(); alternarAba('aba-exibir');">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const EMAIL_MASTER = 'admin@funfarme.com.br';

        document.addEventListener("DOMContentLoaded", () => {
            carregarUsuarios();

            document.getElementById("form-usuario").addEventListener("submit", async (e) => {
                e.preventDefault();
                const editId = document.getElementById("edit-id").value;
                const payload = {
                    nome: document.getElementById("nome").value,
                    email: document.getElementById("email").value,
                    perfil: document.getElementById("perfil").value,
                    senha: document.getElementById("senha").value
                };

                const url = editId ? `/api/usuarios/${editId}` : "/api/criar-usuario";
                const method = editId ? "PUT" : "POST";

                try {
                    const res = await fetch(url, {
                        method: method,
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    exibirAlerta(data.mensagem, data.sucesso ? 'success' : 'danger');

                    if (data.sucesso) {
                        resetarFormulario();
                        carregarUsuarios();
                        alternarAba('aba-exibir');
                    }
                } catch (err) {
                    exibirAlerta("Erro ao salvar usuário.", "danger");
                }
            });
        });

        async function carregarUsuarios() {
            try {
                const res = await fetch('/api/usuarios');
                const data = await res.json();
                const tbody = document.getElementById("tabela-usuarios");

                if (data.sucesso && data.usuarios.length > 0) {
                    tbody.innerHTML = "";
                    data.usuarios.forEach(u => {
                        const tr = document.createElement("tr");
                        const isMaster = (u.email.toLowerCase() === EMAIL_MASTER.toLowerCase());

                        let acoesHtml = `
                            <button class="btn-action btn-edit" onclick="prepararEdicao(${u.id_usuario}, '${u.nome}', '${u.email}', '${u.perfil}')">Alterar</button>
                            <button class="btn-action btn-delete" onclick="excluirUsuario(${u.id_usuario})">Excluir</button>
                        `;

                        if (isMaster) {
                            acoesHtml = `
                                <span class="badge-protected">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                    Protegido (Master)
                                </span>
                            `;
                        }

                        tr.innerHTML = `
                            <td><strong>${u.nome}</strong></td>
                            <td>${u.email}</td>
                            <td><span class="badge-perfil badge-${u.perfil}">${u.perfil}</span></td>
                            <td style="text-align: right;">${acoesHtml}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = "<tr><td colspan='4'>Nenhum usuário cadastrado.</td></tr>";
                }
            } catch (err) {
                console.error("Erro ao carregar usuários:", err);
            }
        }

        function prepararEdicao(id, nome, email, perfil) {
            if (email.toLowerCase() === EMAIL_MASTER.toLowerCase()) {
                exibirAlerta("O usuário Administrador Master não pode ser editado.", "danger");
                return;
            }

            document.getElementById("edit-id").value = id;
            document.getElementById("nome").value = nome;
            document.getElementById("email").value = email;
            document.getElementById("perfil").value = perfil;
            document.getElementById("senha").value = "";
            document.getElementById("label-senha").innerText = "Nova Senha (opcional)";
            document.getElementById("form-titulo").innerText = "Alterar Usuário";
            document.getElementById("btn-cancelar-edit").classList.remove("hidden");

            alternarAba('aba-adicionar');
        }

        async function excluirUsuario(id) {
            if (!confirm("Tem certeza que deseja excluir este usuário?")) return;

            try {
                const res = await fetch(`/api/usuarios/${id}`, { method: 'DELETE' });
                const data = await res.json();
                exibirAlerta(data.mensagem, data.sucesso ? 'success' : 'danger');

                if (data.sucesso) carregarUsuarios();
            } catch (err) {
                exibirAlerta("Erro ao excluir usuário.", "danger");
            }
        }

        function resetarFormulario() {
            document.getElementById("edit-id").value = "";
            document.getElementById("form-usuario").reset();
            document.getElementById("label-senha").innerText = "Senha de Acesso";
            document.getElementById("form-titulo").innerText = "Novo Usuário";
            document.getElementById("btn-cancelar-edit").classList.add("hidden");
        }

        function alternarAba(abaId) {
            const boxExibir = document.getElementById("aba-exibir");
            const boxAdicionar = document.getElementById("aba-adicionar");
            const btnExibir = document.getElementById("btn-tab-exibir");
            const btnAdicionar = document.getElementById("btn-tab-adicionar");

            if (abaId === 'aba-exibir') {
                boxExibir.classList.remove("hidden-tab");
                boxAdicionar.classList.add("hidden-tab");

                btnExibir.classList.add("active");
                btnAdicionar.classList.remove("active");
            } else {
                boxExibir.classList.add("hidden-tab");
                boxAdicionar.classList.remove("hidden-tab");

                btnAdicionar.classList.add("active");
                btnExibir.classList.remove("active");
            }
        }

        function exibirAlerta(msg, tipo) {
            const box = document.getElementById("alert-msg");
            box.innerText = msg;
            box.className = `alert-banner alert-${tipo}`;
            box.classList.remove("hidden");
            setTimeout(() => box.classList.add("hidden"), 4000);
        }
    </script>
</body>
</html>
