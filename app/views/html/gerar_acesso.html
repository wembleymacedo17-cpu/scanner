<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Acessos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cartao_retirada.css') }}">
    <style>
        .main-container {
            max-width: 960px !important;
            width: 95% !important;
            margin: 15px auto !important;
            padding-bottom: 90px !important;
        }

        .tabs-header {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .tab-btn {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 10px 18px;
            font-size: 0.88rem;
            font-weight: 700;
            color: #475569;
            cursor: pointer;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn:hover { background: #f1f5f9; border-color: #94a3b8; }

        .tab-btn.active {
            background: #0284c7;
            color: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25);
        }

        .section-box {
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
            border: 1px solid #e2e8f0;
        }

        .hidden-tab { display: none !important; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: 700; color: #334155; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group select {
            width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid #cbd5e1; outline: none; font-size: 0.9rem; box-sizing: border-box; background: #ffffff; transition: all 0.2s ease;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .table-responsive { width: 100%; overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; font-size: 0.9rem; }
        th { padding: 8px 14px; text-align: left; color: #64748b; font-weight: 700; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.8px; border-bottom: 1px solid #f1f5f9; }
        td { padding: 14px; text-align: left; vertical-align: middle; background: #ffffff; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }

        .badge-perfil { padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 0.7rem; letter-spacing: 0.4px; display: inline-block; }
        .badge-ADMIN { background: #fee2e2; color: #991b1b; }
        .badge-OPERADOR { background: #e0f2fe; color: #0369a1; }
        
        .badge-protected {
            background: #f8fafc;
            color: #64748b;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            border: 1px solid #cbd5e1;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* BOTÕES DE AÇÃO COM SVG VETORIZADO (PADRÃO DO SITE) */
        .action-btns-group {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            align-items: center;
        }

        .btn-acao-admin {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: 1px solid transparent;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
            text-decoration: none;
        }
        .btn-acao-admin svg {
            width: 13px;
            height: 13px;
            flex-shrink: 0;
        }

        .btn-edit-usuario {
            background: #fffbeb;
            color: #b45309;
            border-color: #fde68a;
        }
        .btn-edit-usuario:hover {
            background: #fef3c7;
            border-color: #f59e0b;
        }

        .btn-delete-usuario {
            background: #fef2f2;
            color: #b91c1c;
            border-color: #fecaca;
        }
        .btn-delete-usuario:hover {
            background: #fee2e2;
            border-color: #ef4444;
        }

        .form-actions { display: flex; gap: 10px; margin-top: 24px; }

        /* MODAL DE CONFIRMAÇÃO DE SENHA COM NOTIFICAÇÃO INTERNA */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 10000;
        }
        .modal-box {
            background: #ffffff;
            padding: 24px;
            border-radius: 14px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.1);
            position: relative;
            border: 1px solid #e2e8f0;
        }
        .modal-alert {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: none;
        }
        .modal-alert-danger { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

        .btn-voltar-modal {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            color: #334155;
            padding: 9px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-voltar-modal:hover { background: #f1f5f9; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="main-container">
        <header class="app-header">
            <div class="header-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <line x1="20" y1="8" x2="20" y2="14"></line>
                    <line x1="17" y1="11" x2="23" y2="11"></line>
                </svg>
            </div>
            <div>
                <h2>Gestão de Acessos</h2>
                <p>Gerenciamento de usuários e privilégios do sistema</p>
            </div>
        </header>

        <!-- Controle de Abas -->
        <div class="tabs-header">
            <button class="tab-btn active" id="btn-tab-exibir" onclick="alternarAba('aba-exibir')">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                Exibir Usuários
            </button>
            <button class="tab-btn" id="btn-tab-adicionar" onclick="alternarAba('aba-adicionar')">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                + Adicionar Usuário
            </button>
        </div>

        <div id="alert-msg" class="alert-banner hidden"></div>

        <!-- ABA 1: Tabela de Usuários -->
        <div id="aba-exibir" class="section-box">
            <h3 style="margin-bottom: 12px; color: #1e293b; font-size: 1.1rem;">Usuários Cadastrados</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Perfil</th>
                            <th style="text-align: right;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-usuarios">
                        <tr><td colspan="4">Carregando usuários...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ABA 2: Formulário de Cadastro/Edição -->
        <div id="aba-adicionar" class="section-box hidden-tab">
            <h3 id="form-titulo" style="margin-bottom: 16px; color: #1e293b; font-size: 1.1rem;">Novo Usuário</h3>
            <form id="form-usuario">
                <input type="hidden" id="edit-id" value="" />

                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="nome" required placeholder="Ex: Jhonatan Chavez" />
                </div>
                <div class="form-group">
                    <label>E-mail Corporativo</label>
                    <input type="email" id="email" required placeholder="Jhonatan@funfarme.com.br" />
                </div>
                <div class="form-group">
                    <label id="label-senha">Senha de Acesso</label>
                    <input type="password" id="senha" placeholder="••••••••" />
                </div>
                <div class="form-group">
                    <label>Perfil de Acesso</label>
                    <select id="perfil">
                        <option value="OPERADOR">Operador</option>
                        <option value="ADMIN">Administrador</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" id="btn-salvar-user" class="btn btn-entregar" style="flex: 1; padding: 11px;">Salvar Usuário</button>
                    <button type="button" id="btn-cancelar-edit" class="btn btn-secondary hidden" style="padding: 11px;" onclick="resetarFormulario(); alternarAba('aba-exibir');">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL DE CONFIRMAÇÃO DE SENHA DO ADMIN -->
    <div id="modal-confirmar-senha" class="modal-overlay hidden">
        <div class="modal-box">
            <h3 style="color: #0f172a; margin-bottom: 6px;" id="senha-modal-titulo">Autenticação de Segurança</h3>
            <p style="font-size: 0.83rem; color: #64748b; margin-bottom: 12px;" id="senha-modal-subtitulo">Confirme sua senha de Administrador para prosseguir com esta ação.</p>
            
            <div id="modal-alert-msg" class="modal-alert modal-alert-danger"></div>

            <div style="margin-bottom: 16px;">
                <label style="display: block; font-size: 0.8rem; font-weight: 700; color: #475569; margin-bottom: 4px;">Senha do Usuário Logado</label>
                <input type="password" id="modal-input-senha" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.9rem; outline: none; box-sizing: border-box;" placeholder="••••••••" onkeydown="if(event.key==='Enter') executarAcaoComSenha();" />
            </div>

            <div style="display: flex; gap: 8px; justify-content: flex-end;">
                <button type="button" class="btn-voltar-modal" onclick="fecharModalSenha()">Cancelar</button>
                <button type="button" class="btn-acao-admin btn-delete-usuario" style="padding: 9px 16px;" onclick="executarAcaoComSenha()">Confirmar Ação</button>
            </div>
        </div>
    </div>

    <script>
        const EMAIL_MASTER = 'admin@funfarme.com.br';
        let acaoPendenteCallback = null;

        document.addEventListener("DOMContentLoaded", () => {
            carregarUsuarios();

            document.getElementById("form-usuario").addEventListener("submit", (e) => {
                e.preventDefault();
                const editId = document.getElementById("edit-id").value;

                if (editId) {
                    abrirModalSenha(
                        "Confirmar Alteração de Usuário",
                        "Insira sua senha de Administrador para aplicar as alterações neste usuário.",
                        submeterFormularioUsuario
                    );
                } else {
                    submeterFormularioUsuario();
                }
            });
        });

        async function submeterFormularioUsuario() {
            const editId = document.getElementById("edit-id").value;
            const payload = {
                nome: document.getElementById("nome").value,
                email: document.getElementById("email").value,
                perfil: document.getElementById("perfil").value,
                senha: document.getElementById("senha").value
            };

            const url = editId ? `/api/usuarios/${editId}` : "/api/criar-usuario";
            const method = editId ? "PUT" : "POST";

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                exibirAlerta(data.mensagem, data.sucesso ? 'success' : 'danger');

                if (data.sucesso) {
                    resetarFormulario();
                    carregarUsuarios();
                    alternarAba('aba-exibir');
                }
            } catch (err) {
                exibirAlerta("Erro ao salvar usuário.", "danger");
            }
        }

        async function carregarUsuarios() {
            try {
                const res = await fetch('/api/usuarios');
                const data = await res.json();
                const tbody = document.getElementById("tabela-usuarios");

                if (data.sucesso && data.usuarios.length > 0) {
                    tbody.innerHTML = "";
                    data.usuarios.forEach(u => {
                        const tr = document.createElement("tr");
                        const isMaster = (u.email.toLowerCase() === EMAIL_MASTER.toLowerCase());

                        let acoesHtml = `
                            <div class="action-btns-group">
                                <button class="btn-acao-admin btn-edit-usuario" onclick="prepararEdicao(${u.id_usuario}, '${u.nome}', '${u.email}', '${u.perfil}')" title="Alterar Usuário">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                    Alterar
                                </button>
                                <button class="btn-acao-admin btn-delete-usuario" onclick="solicitarExclusaoUsuario(${u.id_usuario})" title="Excluir Usuário">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                                    Excluir
                                </button>
                            </div>
                        `;

                        if (isMaster) {
                            acoesHtml = `
                                <div style="text-align: right;">
                                    <span class="badge-protected">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                        Protegido (Master)
                                    </span>
                                </div>
                            `;
                        }

                        tr.innerHTML = `
                            <td><strong>${u.nome}</strong></td>
                            <td>${u.email}</td>
                            <td><span class="badge-perfil badge-${u.perfil}">${u.perfil}</span></td>
                            <td style="text-align: right;">${acoesHtml}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = "<tr><td colspan='4' style='text-align: center; padding: 20px; color: #64748b;'>Nenhum usuário cadastrado.</td></tr>";
                }
            } catch (err) {
                console.error("Erro ao carregar usuários:", err);
            }
        }

        function prepararEdicao(id, nome, email, perfil) {
            if (email.toLowerCase() === EMAIL_MASTER.toLowerCase()) {
                exibirAlerta("O usuário Administrador Master não pode ser editado.", "danger");
                return;
            }

            document.getElementById("edit-id").value = id;
            document.getElementById("nome").value = nome;
            document.getElementById("email").value = email;
            document.getElementById("perfil").value = perfil;
            document.getElementById("senha").value = "";
            document.getElementById("label-senha").innerText = "Nova Senha (opcional)";
            document.getElementById("form-titulo").innerText = "Alterar Usuário";
            document.getElementById("btn-cancelar-edit").classList.remove("hidden");

            alternarAba('aba-adicionar');
        }

        /* GERENCIAMENTO DO MODAL DE SENHA E NOTIFICAÇÃO INTERNA */
        function abrirModalSenha(titulo, subtitulo, callback) {
            document.getElementById("senha-modal-titulo").innerText = titulo;
            document.getElementById("senha-modal-subtitulo").innerText = subtitulo;
            document.getElementById("modal-input-senha").value = "";
            fecharAlertaModal();
            acaoPendenteCallback = callback;
            document.getElementById("modal-confirmar-senha").classList.remove("hidden");
            document.getElementById("modal-input-senha").focus();
        }

        function fecharModalSenha() {
            document.getElementById("modal-confirmar-senha").classList.add("hidden");
            fecharAlertaModal();
            acaoPendenteCallback = null;
        }

        function exibirAlertaModal(msg) {
            const box = document.getElementById("modal-alert-msg");
            box.innerText = msg;
            box.style.display = "block";
        }

        function fecharAlertaModal() {
            const box = document.getElementById("modal-alert-msg");
            box.style.display = "none";
            box.innerText = "";
        }

        async function executarAcaoComSenha() {
            const senha = document.getElementById("modal-input-senha").value.trim();
            if (!senha) {
                exibirAlertaModal("Por favor, digite sua senha de confirmação.");
                return;
            }

            try {
                const res = await fetch('/api/validar-senha-admin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ senha })
                });

                const data = await res.json();
                if (!data.sucesso) {
                    exibirAlertaModal(data.mensagem || "Senha incorreta!");
                    return;
                }

                const callback = acaoPendenteCallback;
                fecharModalSenha();
                if (callback) await callback();
            } catch (err) {
                exibirAlertaModal("Erro de conexão ao validar credenciais.");
            }
        }

        function solicitarExclusaoUsuario(id) {
            abrirModalSenha(
                "Confirmar Exclusão de Usuário",
                "Insira sua senha de Administrador para confirmar a exclusão deste usuário.",
                async () => {
                    try {
                        const res = await fetch(`/api/usuarios/${id}`, { method: 'DELETE' });
                        const data = await res.json();
                        exibirAlerta(data.mensagem, data.sucesso ? 'success' : 'danger');

                        if (data.sucesso) carregarUsuarios();
                    } catch (err) {
                        exibirAlerta("Erro ao excluir usuário.", "danger");
                    }
                }
            );
        }

        function resetarFormulario() {
            document.getElementById("edit-id").value = "";
            document.getElementById("form-usuario").reset();
            document.getElementById("label-senha").innerText = "Senha de Acesso";
            document.getElementById("form-titulo").innerText = "Novo Usuário";
            document.getElementById("btn-cancelar-edit").classList.add("hidden");
        }

        function alternarAba(abaId) {
            const boxExibir = document.getElementById("aba-exibir");
            const boxAdicionar = document.getElementById("aba-adicionar");
            const btnExibir = document.getElementById("btn-tab-exibir");
            const btnAdicionar = document.getElementById("btn-tab-adicionar");

            if (abaId === 'aba-exibir') {
                boxExibir.classList.remove("hidden-tab");
                boxAdicionar.classList.add("hidden-tab");
                btnExibir.classList.add("active");
                btnAdicionar.classList.remove("active");
            } else {
                boxExibir.classList.add("hidden-tab");
                boxAdicionar.classList.remove("hidden-tab");
                btnAdicionar.classList.add("active");
                btnExibir.classList.remove("active");
            }
        }

        function exibirAlerta(msg, tipo) {
            const box = document.getElementById("alert-msg");
            box.innerText = msg;
            box.className = `alert-banner alert-${tipo}`;
            box.classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => box.classList.add("hidden"), 4000);
        }
    </script>
</body>
</html>
