<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Gerencial - Kits Escolares</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cartao_retirada.css') }}">
    <!-- Importação do Chart.js para gráficos interativos de nível Power BI -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .main-container {
            max-width: 1100px !important;
            width: 95% !important;
            margin: 15px auto !important;
            padding-bottom: 90px !important;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 16px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            overflow: hidden;
        }

        .metric-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
        }
        .card-blue::after { background: #0284c7; }
        .card-green::after { background: #10b981; }
        .card-amber::after { background: #f59e0b; }
        .card-purple::after { background: #8b5cf6; }

        .metric-title {
            font-size: 0.78rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0f172a;
            font-variant-numeric: tabular-nums;
        }

        /* Grid de Gráficos */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-box {
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chart-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .chart-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #1e293b;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #10b981;
            background: #dcfce7;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid #86efac;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @media (max-width: 768px) {
            .metrics-grid { grid-template-columns: 1fr; }
            .charts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <header class="app-header">
            <div class="header-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="20" x2="18" y2="10"></line>
                    <line x1="12" y1="20" x2="12" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="14"></line>
                </svg>
            </div>
            <div style="flex: 1;">
                <h2>Dashboard Gerencial</h2>
                <p>Acompanhamento em tempo real das entregas e operações</p>
            </div>
            <div class="live-indicator">
                <span class="live-dot"></span> Ao Vivo
            </div>
        </header>

        <!-- Cartões de Métricas (KPIs) -->
        <div class="metrics-grid">
            <div class="metric-card card-blue">
                <span class="metric-title">Total Cadastrados</span>
                <span class="metric-value" id="kpi-total">--</span>
            </div>
            <div class="metric-card card-green">
                <span class="metric-title">Entregas Concluídas</span>
                <span class="metric-value" id="kpi-entregues">--</span>
            </div>
            <div class="metric-card card-amber">
                <span class="metric-title">Pendentes / Aguardando</span>
                <span class="metric-value" id="kpi-pendentes">--</span>
            </div>
            <div class="metric-card card-purple">
                <span class="metric-title">Entregas Parciais</span>
                <span class="metric-value" id="kpi-parciais">--</span>
            </div>
        </div>

        <!-- Seção de Gráficos Interativos -->
        <div class="charts-grid">
            <!-- Gráfico 1: Status das Entregas (Rosca) -->
            <div class="chart-box">
                <div class="chart-header">
                    <span class="chart-title">Status Geral das Entregas</span>
                </div>
                <div class="canvas-container">
                    <canvas id="chartStatus"></canvas>
                </div>
            </div>

            <!-- Gráfico 2: Modelos Mais Baixados (Colunas) -->
            <div class="chart-box">
                <div class="chart-header">
                    <span class="chart-title">Mochilas Mais Entregues</span>
                </div>
                <div class="canvas-container">
                    <canvas id="chartModelos"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chartStatusInstance = null;
        let chartModelosInstance = null;

        document.addEventListener("DOMContentLoaded", () => {
            carregarDadosDashboard();
            // Atualiza o dashboard automaticamente a cada 10 segundos em tempo real
            setInterval(carregarDadosDashboard, 10000);
        });

        async function carregarDadosDashboard() {
            try {
                const res = await fetch('/api/dashboard/metricas');
                const data = await res.json();

                if (data.sucesso) {
                    const cards = data.cards;
                    document.getElementById("kpi-total").innerText = cards.total_cadastrados;
                    document.getElementById("kpi-entregues").innerText = cards.entregues;
                    document.getElementById("kpi-pendentes").innerText = cards.pendentes;
                    document.getElementById("kpi-parciais").innerText = cards.parciais;

                    renderizarGraficoStatus(cards);
                    renderizarGraficoModelos(data.modelos_ranking);
                }
            } catch (err) {
                console.error("Erro ao carregar dados do dashboard:", err);
            }
        }

        function renderizarGraficoStatus(cards) {
            const ctx = document.getElementById('chartStatus').getContext('2d');
            
            const dados = {
                labels: ['Entregues', 'Pendentes', 'Parciais'],
                datasets: [{
                    data: [cards.entregues, cards.pendentes, cards.parciais],
                    backgroundColor: ['#10b981', '#cbd5e1', '#f59e0b'],
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            };

            if (chartStatusInstance) {
                chartStatusInstance.data = dados;
                chartStatusInstance.update();
            } else {
                chartStatusInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: dados,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 12, font: { weight: '600', size: 12 } } }
                        },
                        cutout: '70%'
                    }
                });
            }
        }

        function renderizarGraficoModelos(rankingModelos) {
            const ctx = document.getElementById('chartModelos').getContext('2d');
            
            // Ordena os modelos por quantidade e pega os top 6 para o gráfico não ficar poluído
            const entradasOrdenadas = Object.entries(rankingModelos).sort((a, b) => b[1] - a[1]).slice(0, 6);
            const labels = entradasOrdenadas.map(item => item.item[0] || item[0]);
            const valores = entradasOrdenadas.map(item => item.item[1] || item[1]);

            const dados = {
                labels: labels.length > 0 ? labels : ['Nenhuma baixa ainda'],
                datasets: [{
                    label: 'Kits Entregues',
                    data: valores.length > 0 ? valores : [0],
                    backgroundColor: '#0284c7',
                    borderRadius: 6
                }]
            };

            if (chartModelosInstance) {
                chartModelosInstance.data = dados;
                chartModelosInstance.update();
            } else {
                chartModelosInstance = new Chart(ctx, {
                    type: 'bar',
                    data: dados,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { precision: 0 } },
                            x: { grid: { display: false }, ticks: { font: { weight: '600', size: 11 } } }
                        }
                    }
                });
            }
        }
    </script>
</body>
</html>
