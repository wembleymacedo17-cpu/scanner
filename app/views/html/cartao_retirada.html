<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão de Retirada - Kits Escolares</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cartao_retirada.css') }}">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
    <div class="main-container">
        <!-- Header da Página -->
        <header class="app-header">
            <h2>
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12.378 1.602a.75.75 0 0 0-.756 0L3 6.632l9 5.25 9-5.25-8.622-5.03ZM21.75 7.93l-9 5.25v9.57l8.622-5.03a.75.75 0 0 0 .378-.652V7.93ZM2.25 7.93v9.168c0 .265.14.51.378.652l8.622 5.03v-9.57l-9-5.25Z"/>
                </svg>
                Cartão de Retirada de Kit
            </h2>
            <p>Escanear QR Code ou buscar por Crachá/CPF para registrar entregas</p>
        </header>

        <!-- BUSCA MANUAL POR CRACHÁ OU CPF -->
        <div class="search-box-container">
            <div class="search-input-wrapper">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="input-busca-manual" placeholder="Buscar por Crachá / ID ou CPF..." />
                <button type="button" id="btn-buscar-manual" class="btn-search">Consultar</button>
            </div>
        </div>

        <!-- Área da Câmera -->
        <div id="reader-container" class="scanner-wrapper">
            <div id="reader"></div>
        </div>

        <!-- Alerta Global -->
        <div id="alert-box" class="alert-banner hidden"></div>

        <!-- CARTÃO DE RETIRADA -->
        <div id="cartao-retirada" class="card-container hidden">
            <div class="card-header">
                <span id="badge-publico" class="publico-tag">---</span>
                <span id="badge-status-geral" class="status-tag">PENDENTE</span>
            </div>

            <div class="colaborador-box">
                <div class="info-group">
                    <span class="label">NOME DO COLABORADOR</span>
                    <strong id="colab-nome" class="value-highlight">---</strong>
                </div>
                <div class="info-row">
                    <div class="info-group">
                        <span class="label">CRACHÁ / ID</span>
                        <span id="colab-id" class="value">---</span>
                    </div>
                    <div class="info-group">
                        <span class="label">TOTAL DE KITS</span>
                        <span id="colab-total-kits" class="value badge-count">0</span>
                    </div>
                </div>
            </div>

            <hr class="divider">

            <div class="kits-section">
                <h3>Kits a Entregar</h3>
                <div id="lista-kits-container" class="kits-grid"></div>
            </div>

            <div class="card-footer">
                <button id="btn-novo-scan" class="btn btn-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                    Escanear Outro / Nova Consulta
                </button>
            </div>
        </div>
    </div>

    <script>
        let html5QrCode = null;
        let codigoAtualScan = null;

        // Categorização Oficial das Mochilas/Kits por Etapa de Ensino
        const CATEGORIAS_KITS = {
            "INFANTIL": ["Abelha", "Unicornio", "Borboleta", "Cachorro", "Dinossauro"],
            "EFI": ["EFI-1", "EFI-2", "EFI-3", "EFI-4", "EFI-5", "EFI-6", "EFI-7", "EFI-8", "EFI-9", "EFI-10", "EFI-11"],
            "EFII": ["EFII-1", "EFII-2", "EFII-3", "EFII-4", "EFII-5", "EFII-6", "EFII-7", "EFII-8", "EFII-9", "EFII-10", "EFII-11", "EFII-12", "EFII-13","EFII-14", "EFII-15", "EFII-16"],
            "EM": ["EM-1", "EM-2", "EM-3", "EM-4", "EM-5", "EM-6", "EM-7", "EM-8", "EM-9", "EM-10", "EM-11", "EM-12","EM-13"]
        };

        // Fallback contendo todas as opções
        const TODOS_OS_KITS = [
            ...CATEGORIAS_KITS["INFANTIL"],
            ...CATEGORIAS_KITS["EFI"],
            ...CATEGORIAS_KITS["EFII"],
            ...CATEGORIAS_KITS["EM"]
        ];

        document.addEventListener("DOMContentLoaded", () => {
            iniciarScanner();

            document.getElementById("btn-novo-scan").addEventListener("click", () => {
                document.getElementById("cartao-retirada").classList.add("hidden");
                esconderAlerta();
                iniciarScanner();
            });

            document.getElementById("btn-buscar-manual").addEventListener("click", realizarBuscaManual);
            document.getElementById("input-busca-manual").addEventListener("keypress", (e) => {
                if (e.key === "Enter") realizarBuscaManual();
            });
        });

        function iniciarScanner() {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess
            ).catch(err => {
                mostrarAlerta("Erro ao acessar câmera: " + err, "danger");
            });
        }

        function onScanSuccess(decodedText) {
            let codigoLimpo = decodedText.trim();
            if (codigoLimpo.includes("RETIRADA_KIT:")) {
                codigoLimpo = codigoLimpo.replace("RETIRADA_KIT:", "").trim();
            }

            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    consultarRetirada(codigoLimpo);
                }).catch(err => console.error(err));
            } else {
                consultarRetirada(codigoLimpo);
            }
        }

        function realizarBuscaManual() {
            const termo = document.getElementById("input-busca-manual").value.trim();
            if (!termo) {
                mostrarAlerta("Digite um Crachá ou CPF para consultar.", "danger");
                return;
            }

            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    consultarRetirada(termo);
                }).catch(() => consultarRetirada(termo));
            } else {
                consultarRetirada(termo);
            }
        }

        async function consultarRetirada(termo) {
            try {
                esconderAlerta();
                const response = await fetch(`/api/buscar/${encodeURIComponent(termo)}`);
                const result = await response.json();

                if (response.ok && result.sucesso) {
                    codigoAtualScan = result.dados.codigo_retirada;
                    renderizarCartao(result.dados);
                } else {
                    mostrarAlerta(result.mensagem || "Registro não encontrado.", "danger");
                }
            } catch (err) {
                mostrarAlerta("Erro de conexão com o servidor.", "danger");
            }
        }

        function renderizarCartao(dados) {
            document.getElementById("badge-publico").innerText = `Público: ${dados.tipo_publico || 'Dependente'}`;
            document.getElementById("colab-nome").innerText = dados.nome_colaborador || "NÃO INFORMADO";
            document.getElementById("colab-id").innerText = dados.id_colaborador;
            document.getElementById("colab-total-kits").innerText = dados.qtd_kits;

            atualizarBadgeStatusGeral(dados.status);

            const container = document.getElementById("lista-kits-container");
            container.innerHTML = "";

            const listaItens = parseResumoKits(dados.resumo_kits, dados.detalhes_entregas, dados.status);

            listaItens.forEach((item, index) => {
                const cardKit = document.createElement("div");
                cardKit.className = `kit-item-card ${item.entregue ? 'kit-entregue' : ''}`;
                
                const iconUserSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`;
                const iconCheckSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
                const iconBoxSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>`;

                cardKit.innerHTML = `
                    <div class="kit-item-header">
                        <span class="kit-dependente-nome">${iconUserSVG} ${item.nome_dependente}</span>
                        <span class="kit-status-badge ${item.entregue ? 'badge-entregue' : 'badge-pendente'}">
                            ${item.entregue ? 'ENTREGUE' : 'PENDENTE'}
                        </span>
                    </div>

                    <div class="kit-item-body">
                        <label class="field-label">Modelo do Kit (Estoque - Categoria: <strong>${item.categoria_detectada}</strong>):</label>
                        <select id="select-modelo-${index}" class="select-modelo" ${item.entregue ? 'disabled' : ''}>
                            ${gerarOptionsModelos(item.modelo_selecionado, item.categoria_detectada)}
                        </select>
                    </div>

                    <div class="kit-item-action">
                        <button id="btn-entregar-${index}" class="btn ${item.entregue ? 'btn-disabled' : 'btn-entregar'}"
                                ${item.entregue ? 'disabled' : ''} 
                                onclick="entregarKitIndividual(${index})">
                            ${item.entregue ? iconCheckSVG + ' Kit Entregue' : iconBoxSVG + ' Confirmar Entrega Deste Kit'}
                        </button>
                    </div>
                `;
                container.appendChild(cardKit);
            });

            document.getElementById("cartao-retirada").classList.remove("hidden");
        }

        // Analisa a string resumo_kits. Suporta separador por pipe ('|') e desmembramento por vírgula em cadastros órfãos.
        function parseResumoKits(resumoStr, detalhesEntregas, statusGeral) {
            if (!resumoStr) return [];
            
            const partesIniciais = resumoStr.split('|').map(p => p.trim());
            const entregas = detalhesEntregas || {};
            const listaItensFinais = [];

            partesIniciais.forEach(parte => {
                let textoUpper = parte.toUpperCase();

                // Trata casos de Kits Automáticos (Órfãos)
                if (textoUpper.includes("ÓRFÃOS") || textoUpper.includes("ORFAOS") || textoUpper.includes("AUTOMÁTICOS") || textoUpper.includes("AUTOMATICOS")) {
                    let conteudoNomes = parte;
                    if (parte.includes(":")) {
                        conteudoNomes = parte.split(":")[1].trim();
                    } else {
                        conteudoNomes = parte.replace(/Kits Automáticos \(Órfãos\)/gi, "").replace(/Kits Automáticos/gi, "").replace(/^[:\s-]+/, "").trim();
                    }

                    // Se existirem múltiplos nomes separados por vírgula na mesma linha
                    const nomesSeparados = conteudoNomes.split(',').map(n => n.trim()).filter(n => n.length > 0);

                    nomesSeparados.forEach(nomeFilho => {
                        listaItensFinais.push({
                            raw: parte,
                            nome: nomeFilho,
                            eOrfao: true,
                            categoria: "ÓRFÃO (LIVRE)"
                        });
                    });
                } else {
                    const pedacos = parte.split('-').map(s => s.trim());
                    let nome = pedacos[0] || "Dependente";

                    let categoriaDetectada = "TODAS";
                    if (textoUpper.includes("INFANTIL") || textoUpper.includes("CRECHE") || textoUpper.includes("ETAPA")) {
                        categoriaDetectada = "INFANTIL";
                    } else if (textoUpper.includes("FUNDAMENTAL 1") || textoUpper.includes("FUNDAMENTAL I") || textoUpper.includes("EFI-")) {
                        if (textoUpper.includes("FUNDAMENTAL 2") || textoUpper.includes("FUNDAMENTAL II") || textoUpper.includes("EFII-")) {
                            categoriaDetectada = "EFII";
                        } else {
                            categoriaDetectada = "EFI";
                        }
                    } else if (textoUpper.includes("FUNDAMENTAL 2") || textoUpper.includes("FUNDAMENTAL II") || textoUpper.includes("EFII-")) {
                        categoriaDetectada = "EFII";
                    } else if (textoUpper.includes("MÉDIO") || textoUpper.includes("MEDIO") || textoUpper.includes("EM-")) {
                        categoriaDetectada = "EM";
                    }

                    listaItensFinais.push({
                        raw: parte,
                        nome: nome,
                        eOrfao: false,
                        categoria: categoriaDetectada
                    });
                }
            });

            return listaItensFinais.map((itemObj, i) => {
                let modeloDetectado = null;

                if (!itemObj.eOrfao) {
                    for (let mod of TODOS_OS_KITS) {
                        const regex = new RegExp(`\\b${mod}\\b`, 'i');
                        if (regex.test(itemObj.raw)) {
                            modeloDetectado = mod;
                            break;
                        }
                    }
                    if (!modeloDetectado) {
                        modeloDetectado = itemObj.raw.split('-').pop().trim() || "---";
                    }
                } else {
                    // Para órfãos, seleciona "---" por padrão para exigir escolha manual do entregador
                    modeloDetectado = "---";
                }

                const chaveItem = `kit_${i}`;
                const statusItem = entregas[chaveItem] || {};
                const jaEntregue = statusGeral === 'ENTREGUE' || statusItem.entregue === true;

                return {
                    id_item: chaveItem,
                    nome_dependente: itemObj.nome,
                    modelo_selecionado: statusItem.modelo || modeloDetectado,
                    categoria_detectada: itemObj.categoria,
                    entregue: jaEntregue
                };
            });
        }

        // Gera as opções do <select> incluindo "---" no topo como opção neutra obrigatoriamente
        function gerarOptionsModelos(modeloAtual, categoria) {
            let html = "";
            let listaFiltrada = (categoria === "ÓRFÃO (LIVRE)" || categoria === "TODAS") ? TODOS_OS_KITS : (CATEGORIAS_KITS[categoria] || TODOS_OS_KITS);
            
            // Garante que "---" esteja disponível
            if (!listaFiltrada.includes("---")) {
                listaFiltrada = ["---", ...listaFiltrada];
            }

            let encontrado = false;

            listaFiltrada.forEach(mod => {
                const selected = (mod.toLowerCase() === (modeloAtual || "").toLowerCase());
                if (selected) encontrado = true;
                html += `<option value="${mod}" ${selected ? 'selected' : ''}>${mod}</option>`;
            });

            if (!encontrado && modeloAtual) {
                html = `<option value="${modeloAtual}" selected>${modeloAtual} (Atual)</option>` + html;
            }

            return html;
        }

        async function entregarKitIndividual(indexItem) {
            const selectModelo = document.getElementById(`select-modelo-${indexItem}`);
            const modeloEscolhido = selectModelo ? selectModelo.value.trim() : "---";

            // VÁLVULA DE SEGURANÇA: Impede a baixa se o modelo estiver como "---"
            if (modeloEscolhido === "---" || !modeloEscolhido) {
                mostrarAlerta("Atenção: Selecione um modelo de kit válido antes de confirmar a entrega!", "danger");
                selectModelo.focus();
                return;
            }

            try {
                esconderAlerta();
                const response = await fetch('/api/dar-baixa-item', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        codigo_retirada: codigoAtualScan,
                        index_kit: indexItem,
                        modelo_baixa: modeloEscolhido
                    })
                });

                const result = await response.json();

                if (response.ok && result.sucesso) {
                    mostrarAlerta(result.mensagem, "success");
                    codigoAtualScan = result.dados.codigo_retirada;
                    renderizarCartao(result.dados);
                } else {
                    mostrarAlerta(result.mensagem || "Erro ao efetuar baixa do kit.", "danger");
                }
            } catch (err) {
                mostrarAlerta("Erro de conexão ao dar baixa.", "danger");
            }
        }

        function atualizarBadgeStatusGeral(status) {
            const el = document.getElementById("badge-status-geral");
            el.innerText = status;
            el.className = `status-tag status-${status.replace(' ', '-')}`;
        }

        function mostrarAlerta(msg, tipo) {
            const box = document.getElementById("alert-box");
            box.innerText = msg;
            box.className = `alert-banner alert-${tipo}`;
            box.classList.remove("hidden");
        }

        function esconderAlerta() {
            document.getElementById("alert-box").classList.add("hidden");
        }
    </script>
</body>
</html>
