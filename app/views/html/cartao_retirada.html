<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão de Retirada - Kits Escolares</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cartao_retirada.css') }}">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        .main-container {
            padding-bottom: 90px !important;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Header Principal com Ícone SVG Dinâmico -->
        <header class="app-header">
            <div id="header-icon-container" class="header-icon">
                <!-- Ícone SVG injetado via JavaScript conforme o modo -->
            </div>
            <div>
                <h2 id="titulo-modo">Retirada de Kits Escolares</h2>
                <p id="subtitulo-modo">Consulta e baixa de entregas</p>
            </div>
        </header>

        <!-- Alerta Global (Notificação no topo da página) -->
        <div id="alert-box" class="alert-banner hidden"></div>

        <!-- BUSCA MANUAL COM AUTOCOMPLETE (Exibido no modo BUSCAR) -->
        <div id="box-busca-container" class="search-box-container hidden">
            <div class="search-input-wrapper">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="input-busca-manual" placeholder="Buscar por Nome, Crachá ou CPF..." autocomplete="off" />
                <button type="button" id="btn-buscar-manual" class="btn-search">Consultar</button>
            </div>
            <ul id="autocomplete-results" class="autocomplete-list hidden"></ul>
        </div>

        <!-- Área da Câmera (Exibida no modo Ler QR Code) -->
        <div id="reader-container" class="scanner-wrapper hidden">
            <div id="reader"></div>
        </div>

        <!-- CARTÃO DE RETIRADA -->
        <div id="cartao-retirada" class="card-container hidden">
            <div class="colaborador-card">
                <div class="colab-top-bar">
                    <span id="badge-publico" class="publico-tag">---</span>
                    <span id="badge-status-geral" class="status-tag">PENDENTE</span>
                </div>

                <div class="colab-main-info">
                    <span class="label">COLABORADOR</span>
                    <strong id="colab-nome" class="colab-nome">---</strong>
                </div>

                <div class="colab-metrics">
                    <div class="metric-item">
                        <span class="metric-label">CRACHÁ / ID</span>
                        <span id="colab-id" class="metric-value">---</span>
                    </div>
                    <div class="metric-divider"></div>
                    <div class="metric-item">
                        <span class="metric-label">TOTAL DE KITS</span>
                        <span id="colab-total-kits" class="metric-badge">0</span>
                    </div>
                </div>
            </div>

            <div class="kits-section">
                <div class="section-header">
                    <h3>Dependente(s) e Mochilas</h3>
                </div>
                <div id="lista-kits-container" class="kits-grid"></div>
            </div>

            <div class="card-footer">
                <button id="btn-novo-scan" class="btn btn-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                    Nova Consulta / Limpar
                </button>
            </div>
        </div>
    </div>

    <script>
        let html5QrCode = null;
        let codigoAtualScan = null;
        let debounceTimer = null;
        let autoResetTimer = null;
        let modoAtual = "manual";

        // Variável global para armazenar a disponibilidade real de sobras do estoque
        let mapaDisponibilidadeEstoque = {};

        const SVG_ICONS = {
            camera: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 7V4a2 2 0 0 1 2-2h3"></path>
                        <path d="M20 7V4a2 2 0 0 0-2-2h-3"></path>
                        <path d="M4 17v3a2 2 0 0 0 2 2h3"></path>
                        <path d="M20 17v3a2 2 0 0 1-2 2h-3"></path>
                        <rect x="7" y="7" width="10" height="10" rx="1"></rect>
                    </svg>`,
            buscar: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>`
        };

        const CATEGORIAS_KITS = {
            "INFANTIL": ["Abelha", "Unicornio", "Borboleta", "Cachorro", "Dinossauro"],
            "EFI": ["EFI-1", "EFI-2", "EFI-3", "EFI-4", "EFI-5", "EFI-6", "EFI-7", "EFI-8", "EFI-9", "EFI-10", "EFI-11"],
            "EFII": ["EFII-1", "EFII-2", "EFII-3", "EFII-4", "EFII-5", "EFII-6", "EFII-7", "EFII-8", "EFII-9", "EFII-10", "EFII-11", "EFII-12", "EFII-13","EFII-14", "EFII-15", "EFII-16"],
            "EM": ["EM-1", "EM-2", "EM-3", "EM-4", "EM-5", "EM-6", "EM-7", "EM-8", "EM-9", "EM-10", "EM-11", "EM-12","EM-13"]
        };

        const TODOS_OS_KITS = [
            ...CATEGORIAS_KITS["INFANTIL"],
            ...CATEGORIAS_KITS["EFI"],
            ...CATEGORIAS_KITS["EFII"],
            ...CATEGORIAS_KITS["EM"]
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            modoAtual = urlParams.get('modo') || 'manual';

            configurarModoTela(modoAtual);
            carregarDisponibilidadeEstoque();

            const inputBusca = document.getElementById("input-busca-manual");

            document.getElementById("btn-novo-scan").addEventListener("click", () => {
                resetarConsulta();
            });

            document.getElementById("btn-buscar-manual").addEventListener("click", () => realizarBuscaManual());

            inputBusca.addEventListener("keypress", (e) => {
                if (e.key === "Enter") {
                    esconderSugestoes();
                    realizarBuscaManual();
                }
            });

            inputBusca.addEventListener("input", (e) => {
                clearTimeout(debounceTimer);
                const termo = e.target.value.trim();

                if (termo.length < 2) {
                    esconderSugestoes();
                    return;
                }

                debounceTimer = setTimeout(async () => {
                    try {
                        const response = await fetch(`/api/autocompletar?q=${encodeURIComponent(termo)}`);
                        const result = await response.json();

                        if (result.sucesso && result.sugestoes.length > 0) {
                            renderizarSugestoes(result.sugestoes);
                        } else {
                            esconderSugestoes();
                        }
                    } catch (err) {
                        console.error("Erro na busca de sugestões:", err);
                    }
                }, 300);
            });

            document.addEventListener("click", (e) => {
                if (!e.target.closest("#box-busca-container")) {
                    esconderSugestoes();
                }
            });
        });

        // Consulta rápida ao backend para obter as sobras sem recomputar a base inteira
        async function carregarDisponibilidadeEstoque() {
            try {
                const res = await fetch('/api/estoque/disponibilidade');
                const data = await res.json();
                if (data.sucesso) {
                    mapaDisponibilidadeEstoque = data.disponibilidade || {};
                }
            } catch (e) {
                console.error("Erro ao carregar disponibilidade do estoque:", e);
            }
        }

        function configurarModoTela(modo) {
            const boxBusca = document.getElementById("box-busca-container");
            const readerContainer = document.getElementById("reader-container");
            const titulo = document.getElementById("titulo-modo");
            const subtitulo = document.getElementById("subtitulo-modo");
            const iconContainer = document.getElementById("header-icon-container");

            if (modo === "camera") {
                titulo.innerText = "Leitor de QR Code";
                subtitulo.innerText = "Aproxime o QR Code do cartão para ler";
                iconContainer.innerHTML = SVG_ICONS.camera;
                boxBusca.style.display = "none";
                readerContainer.classList.remove("hidden");
                iniciarScanner();
            } else {
                titulo.innerText = "Consulta por Busca";
                subtitulo.innerText = "Digite o Nome, Crachá ou CPF do colaborador";
                iconContainer.innerHTML = SVG_ICONS.buscar;
                pararScanner();
                readerContainer.classList.add("hidden");
                boxBusca.style.display = "block";
                boxBusca.classList.remove("hidden");
                document.getElementById("input-busca-manual").focus();
            }
        }

        function renderizarSugestoes(sugestoes) {
            const listContainer = document.getElementById("autocomplete-results");
            listContainer.innerHTML = "";

            sugestoes.forEach(item => {
                const li = document.createElement("li");
                li.className = "autocomplete-item";

                const dependentesStr = item.dependentes && item.dependentes.length > 0
                    ? item.dependentes.join(", ")
                    : "Nenhum dependente listado";

                li.innerHTML = `
                    <div class="ac-colaborador">${item.nome_colaborador}</div>
                    <div class="ac-dependentes"><strong>Dependente(s):</strong> ${dependentesStr}</div>
                `;

                li.addEventListener("mouseover", () => {
                    document.querySelectorAll(".autocomplete-item").forEach(el => el.classList.remove("selected"));
                    li.classList.add("selected");
                });

                li.addEventListener("click", () => {
                    document.getElementById("input-busca-manual").value = item.nome_colaborador;
                    esconderSugestoes();
                    consultarRetirada(item.codigo_retirada);
                });

                listContainer.appendChild(li);
            });

            listContainer.classList.remove("hidden");
        }

        function esconderSugestoes() {
            const listContainer = document.getElementById("autocomplete-results");
            listContainer.classList.add("hidden");
            listContainer.innerHTML = "";
        }

        function iniciarScanner() {
            document.getElementById("reader-container").classList.remove("hidden");
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess
            ).catch(err => {
                console.warn("Câmera não iniciada: " + err);
            });
        }

        function pararScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById("reader-container").classList.add("hidden");
                }).catch(err => console.error(err));
            } else {
                document.getElementById("reader-container").classList.add("hidden");
            }
        }

        function onScanSuccess(decodedText) {
            let codigoLimpo = decodedText.trim();
            if (codigoLimpo.includes("RETIRADA_KIT:")) {
                codigoLimpo = codigoLimpo.replace("RETIRADA_KIT:", "").trim();
            }
            pararScanner();
            consultarRetirada(codigoLimpo);
        }

        function realizarBuscaManual(termoParam) {
            const termo = termoParam || document.getElementById("input-busca-manual").value.trim();
            if (!termo) {
                mostrarAlerta("Digite um Nome, Crachá ou CPF para consultar.", "danger");
                return;
            }
            consultarRetirada(termo);
        }

        // CONSULTA ULTRA RÁPIDA EM PARALELO
        async function consultarRetirada(termo) {
            try {
                esconderAlerta();
                if (autoResetTimer) clearTimeout(autoResetTimer);

                const promiseBusca = fetch(`/api/buscar/${encodeURIComponent(termo)}`);
                const promiseEstoque = carregarDisponibilidadeEstoque();

                const [responseBusca] = await Promise.all([promiseBusca, promiseEstoque]);
                const result = await responseBusca.json();

                if (responseBusca.ok && result.sucesso) {
                    codigoAtualScan = result.dados.codigo_retirada;
                    renderizarCartao(result.dados);
                } else {
                    mostrarAlerta(result.mensagem || "Registro não encontrado.", "danger");
                }
            } catch (err) {
                mostrarAlerta("Erro de conexão com o servidor.", "danger");
            }
        }

        function renderizarCartao(dados) {
            document.getElementById("badge-publico").innerText = `${dados.tipo_publico || 'Dependente'}`;
            document.getElementById("colab-nome").innerText = dados.nome_colaborador || "NÃO INFORMADO";
            document.getElementById("colab-id").innerText = dados.id_colaborador;
            document.getElementById("colab-total-kits").innerText = dados.qtd_kits;

            atualizarBadgeStatusGeral(dados.status);

            const container = document.getElementById("lista-kits-container");
            container.innerHTML = "";

            const listaItens = parseResumoKits(dados.resumo_kits, dados.detalhes_entregas, dados.status);

            listaItens.forEach((item, index) => {
                const cardKit = document.createElement("div");
                cardKit.className = `kit-item-card ${item.entregue ? 'kit-entregue' : 'kit-pendente'}`;
                
                const iconUserSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`;
                const iconCheckSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
                const iconBoxSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>`;

                cardKit.innerHTML = `
                    <div class="kit-item-header">
                        <div class="kit-dependente-info">
                            <span class="dep-icon">${iconUserSVG}</span>
                            <span class="kit-dependente-nome">${item.nome_dependente}</span>
                        </div>
                        <span class="cat-pill">${item.categoria_detectada}</span>
                    </div>

                    <div class="kit-item-body">
                        <div class="select-container">
                            <select id="select-modelo-${index}" class="select-modelo" ${item.entregue ? 'disabled' : ''}>
                                ${gerarOptionsModelos(item.modelo_selecionado, item.categoria_detectada, item.eOrfao)}
                            </select>
                        </div>
                    </div>

                    <div class="kit-item-action">
                        <button id="btn-entregar-${index}" class="btn ${item.entregue ? 'btn-disabled' : 'btn-entregar'}"
                                ${item.entregue ? 'disabled' : ''} 
                                onclick="entregarKitIndividual(${index})">
                            ${item.entregue ? iconCheckSVG + ' Kit Entregue' : iconBoxSVG + ' Confirmar Baixa Deste Kit'}
                        </button>
                    </div>
                `;
                container.appendChild(cardKit);
            });

            document.getElementById("cartao-retirada").classList.remove("hidden");
        }

        function parseResumoKits(resumoStr, detalhesEntregas, statusGeral) {
            if (!resumoStr) return [];
            
            const partesIniciais = resumoStr.split('|').map(p => p.trim());
            const entregas = detalhesEntregas || {};
            const listaItensFinais = [];

            partesIniciais.forEach(parte => {
                let textoUpper = parte.toUpperCase();

                if (textoUpper.includes("ÓRFÃOS") || textoUpper.includes("ORFAOS") || textoUpper.includes("AUTOMÁTICOS") || textoUpper.includes("AUTOMATICOS")) {
                    let conteudoNomes = parte;
                    if (parte.includes(":")) {
                        conteudoNomes = parte.split(":")[1].trim();
                    } else {
                        conteudoNomes = parte.replace(/Kits Automáticos \(Órfãos\)/gi, "").replace(/Kits Automáticos/gi, "").replace(/^[:\s-]+/, "").trim();
                    }

                    const nomesSeparados = conteudoNomes.split(',').map(n => n.trim()).filter(n => n.length > 0);

                    nomesSeparados.forEach(nomeFilho => {
                        listaItensFinais.push({
                            raw: parte,
                            nome: nomeFilho,
                            eOrfao: true,
                            categoria: "LIVRE"
                        });
                    });
                } else {
                    const pedacos = parte.split('-').map(s => s.trim());
                    let nome = pedacos[0] || "Dependente";

                    let categoriaDetectada = "TODAS";
                    if (textoUpper.includes("INFANTIL") || textoUpper.includes("CRECHE") || textoUpper.includes("ETAPA")) {
                        categoriaDetectada = "INFANTIL";
                    } else if (textoUpper.includes("FUNDAMENTAL 1") || textoUpper.includes("FUNDAMENTAL I") || textoUpper.includes("EFI-")) {
                        if (textoUpper.includes("FUNDAMENTAL 2") || textoUpper.includes("FUNDAMENTAL II") || textoUpper.includes("EFII-")) {
                            categoriaDetectada = "EFII";
                        } else {
                            categoriaDetectada = "EFI";
                        }
                    } else if (textoUpper.includes("FUNDAMENTAL 2") || textoUpper.includes("FUNDAMENTAL II") || textoUpper.includes("EFII-")) {
                        categoriaDetectada = "EFII";
                    } else if (textoUpper.includes("MÉDIO") || textoUpper.includes("MEDIO") || textoUpper.includes("EM-")) {
                        categoriaDetectada = "EM";
                    }

                    listaItensFinais.push({
                        raw: parte,
                        nome: nome,
                        eOrfao: false,
                        categoria: categoriaDetectada
                    });
                }
            });

            return listaItensFinais.map((itemObj, i) => {
                let modeloDetectado = null;

                if (!itemObj.eOrfao) {
                    for (let mod of TODOS_OS_KITS) {
                        const regex = new RegExp(`\\b${mod}\\b`, 'i');
                        if (regex.test(itemObj.raw)) {
                            modeloDetectado = mod;
                            break;
                        }
                    }
                    if (!modeloDetectado) {
                        modeloDetectado = itemObj.raw.split('-').pop().trim() || "---";
                    }
                } else {
                    modeloDetectado = "---";
                }

                const chaveItem = `kit_${i}`;
                const statusItem = entregas[chaveItem] || {};
                const jaEntregue = statusGeral === 'ENTREGUE' || statusItem.entregue === true;

                return {
                    id_item: chaveItem,
                    nome_dependente: itemObj.nome,
                    modelo_selecionado: statusItem.modelo || modeloDetectado,
                    categoria_detectada: itemObj.categoria,
                    eOrfao: itemObj.eOrfao,
                    entregue: jaEntregue
                };
            });
        }

        function gerarOptionsModelos(modeloAtual, categoria, eOrfao) {
            let html = "";
            let listaFiltrada = (categoria === "LIVRE" || categoria === "TODAS") ? TODOS_OS_KITS : (CATEGORIAS_KITS[categoria] || TODOS_OS_KITS);
            
            if (!listaFiltrada.includes("---")) {
                listaFiltrada = ["---", ...listaFiltrada];
            }

            let encontrado = false;

            listaFiltrada.forEach(mod => {
                if (mod === "---") {
                    const selected = (mod.toLowerCase() === (modeloAtual || "").toLowerCase());
                    html += `<option value="${mod}" ${selected ? 'selected' : ''}> Selecionar Modelo da Mochila...</option>`;
                    return;
                }

                const infoEst = mapaDisponibilidadeEstoque[mod] || { sobra_orfaos: 0, entrada_total: 0 };
                const sobra = infoEst.sobra_orfaos;
                const selected = (mod.toLowerCase() === (modeloAtual || "").toLowerCase());
                if (selected) encontrado = true;

                if (eOrfao && sobra <= 0 && !selected) {
                    html += `<option value="${mod}" disabled style="color: #94a3b8; background-color: #f1f5f9;">🚫 ${mod} (Esgotado p/ Órfãos)</option>`;
                } else {
                    const textoSobra = eOrfao ? ` (${sobra} un disponíveis)` : '';
                    html += `<option value="${mod}" ${selected ? 'selected' : ''}>${mod}${textoSobra}</option>`;
                }
            });

            if (!encontrado && modeloAtual && modeloAtual !== "---") {
                html = `<option value="${modeloAtual}" selected>${modeloAtual}</option>` + html;
            }

            return html;
        }

        async function entregarKitIndividual(indexItem) {
            const selectModelo = document.getElementById(`select-modelo-${indexItem}`);
            const modeloEscolhido = selectModelo ? selectModelo.value.trim() : "---";

            const cardKit = selectModelo ? selectModelo.closest('.kit-item-card') : null;
            const elNomeDep = cardKit ? cardKit.querySelector('.kit-dependente-nome') : null;
            const nomeDependente = elNomeDep ? elNomeDep.innerText.trim() : "";

            if (modeloEscolhido === "---" || !modeloEscolhido) {
                mostrarAlerta("Atenção: Selecione um modelo de kit válido antes de confirmar a entrega!", "danger");
                selectModelo.focus();
                return;
            }

            try {
                esconderAlerta();
                const response = await fetch('/api/dar-baixa-item', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        codigo_retirada: codigoAtualScan,
                        index_kit: indexItem,
                        modelo_baixa: modeloEscolhido,
                        nome_dependente: nomeDependente
                    })
                });

                const result = await response.json();

                if (response.ok && result.sucesso) {
                    mostrarAlerta(result.mensagem, "success");
                    codigoAtualScan = result.dados.codigo_retirada;
                    
                    carregarDisponibilidadeEstoque();
                    renderizarCartao(result.dados);

                    if (result.dados.status === 'ENTREGUE') {
                        mostrarAlerta("Todos os kits foram baixados! Reiniciando consulta em 3 segundos...", "success");
                        autoResetTimer = setTimeout(() => {
                            resetarConsulta();
                        }, 3000);
                    }
                } else {
                    mostrarAlerta(result.mensagem || "Erro ao efetuar baixa do kit.", "danger");
                }
            } catch (err) {
                mostrarAlerta("Erro de conexão ao dar baixa.", "danger");
            }
        }

        function resetarConsulta() {
            if (autoResetTimer) clearTimeout(autoResetTimer);
            document.getElementById("cartao-retirada").classList.add("hidden");
            document.getElementById("input-busca-manual").value = "";
            esconderAlerta();

            if (modoAtual === "camera") {
                iniciarScanner();
            } else {
                document.getElementById("input-busca-manual").focus();
            }
        }

        function atualizarBadgeStatusGeral(status) {
            const el = document.getElementById("badge-status-geral");
            el.innerText = status;
            el.className = `status-tag status-${status.replace(' ', '-')}`;
        }

        function mostrarAlerta(msg, tipo) {
            const box = document.getElementById("alert-box");
            box.innerText = msg;
            box.className = `alert-banner alert-${tipo}`;
            box.classList.remove("hidden");

            // Rola a tela suavemente para o topo para o alerta ficar visível nos telemóveis
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function esconderAlerta() {
            document.getElementById("alert-box").classList.add("hidden");
        }
    </script>
</body>
</html>
