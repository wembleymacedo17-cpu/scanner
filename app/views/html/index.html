<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixas QR Code - Kit Escolar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/menu_glass.css') }}">
    <style>
        /* Widget do Usuário Logado no Canto Superior Direito */
        .user-top-widget {
            position: fixed;
            top: 16px;
            right: 20px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 14px 6px 8px;
            border-radius: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            transition: all 0.3s ease;
        }

        .user-top-widget:hover {
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
        }

        .user-avatar-top {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.88rem;
            text-transform: uppercase;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
        }

        .user-info-top {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .user-name-top {
            color: #f8fafc;
            font-size: 0.82rem;
            font-weight: 600;
            white-space: nowrap;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.1;
        }

        .user-role-badge-top {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 2px;
            letter-spacing: 0.5px;
            width: fit-content;
        }

        .role-ADMIN {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .role-OPERADOR {
            background: rgba(56, 189, 248, 0.2);
            color: #7dd3fc;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        /* Estilo para o link de Sair no menu */
        .menu-link.logout-link {
            color: #ef4444;
        }
        .menu-link.logout-link:hover {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        /* Ajuste responsivo para telas móveis pequenas */
        @media (max-width: 480px) {
            .user-top-widget {
                top: 10px;
                right: 12px;
                padding: 4px 10px 4px 6px;
            }
            .user-name-top {
                max-width: 100px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <!-- WIDGET FIXO DO USUÁRIO NO CANTO SUPERIOR DIREITO -->
    <div class="user-top-widget" title="Usuário Autenticado">
        <div class="user-avatar-top">
            {{ usuario[0] if usuario else 'U' }}
        </div>
        <div class="user-info-top">
            <span class="user-name-top">{{ usuario or 'Usuário' }}</span>
            <span class="user-role-badge-top role-{{ perfil }}">{{ perfil }}</span>
        </div>
    </div>

    <main class="app-viewport">
        <iframe id="main-frame" src="/entregar-kit?modo=manual" frameborder="0"></iframe>
    </main>

    <!-- MENU FLUTUANTE INFERIOR LIMPO E LEVE -->
    <nav class="menu">
        <!-- 1. BUSCAR -->
        <a href="javascript:void(0)" class="menu-link active" onclick="carregarTela('/entregar-kit?modo=manual', this)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>BUSCAR</span>
        </a>

        <!-- 2. Ler QR Code -->
        <a href="javascript:void(0)" class="menu-link" onclick="carregarTela('/entregar-kit?modo=camera', this)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>Ler QR Code</span>
        </a>

        <!-- 3. Histórico -->
        <a href="javascript:void(0)" class="menu-link" onclick="carregarTela('/historico', this)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span>Histórico</span>
        </a>

        {% if perfil == 'ADMIN' %}
        <!-- 4. Dashboard (Restrito a Admins) -->
        <a href="javascript:void(0)" class="menu-link" onclick="carregarTela('/dashboard', this)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
            <span>Dashboard</span>
        </a>

        <!-- 5. Estoque (Restrito a Admins) -->
        <a href="javascript:void(0)" class="menu-link" onclick="carregarTela('/estoque', this)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            </svg>
            <span>Estoque</span>
        </a>

        <!-- 6. Gerar Acesso (Restrito a Admins) -->
        <a href="javascript:void(0)" class="menu-link" onclick="carregarTela('/gerar-acesso', this)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="8.5" cy="7" r="4"></circle>
                <line x1="20" y1="8" x2="20" y2="14"></line>
                <line x1="17" y1="11" x2="23" y2="11"></line>
            </svg>
            <span>Gerar Acesso</span>
        </a>
        {% endif %}

        <!-- 7. BOTÃO DE SAIR -->
        <a href="/logout" class="menu-link logout-link" title="Sair do Sistema">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Sair</span>
        </a>
    </nav>

    <script>
        function carregarTela(url, elemento) {
            document.getElementById('main-frame').src = url;
            document.querySelectorAll('.menu-link').forEach(link => {
                link.classList.remove('active');
            });
            elemento.classList.add('active');
        }
    </script>
</body>
</html>
